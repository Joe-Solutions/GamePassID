# Install on the shared EOG/TradeKo EC2 (nginx):
#   sudo cp deploy/nginx-gp-register.joesolutions.ph.conf /etc/nginx/conf.d/gp-register.joesolutions.ph.conf
#   sudo nginx -t && sudo systemctl reload nginx
# Then issue TLS (once DNS A points at this host):
#   sudo certbot --nginx -d gp-register.joesolutions.ph

server {
    listen 80;
    listen [::]:80;
    server_name gp-register.joesolutions.ph;

    client_max_body_size 15m;

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
