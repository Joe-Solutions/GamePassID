name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci
        env:
          # postinstall runs prisma generate; Prisma 7 config requires DATABASE_URL
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gamepassid?schema=public

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gamepassid?schema=public
          AUTH_SECRET: ci-build-only-not-for-production
